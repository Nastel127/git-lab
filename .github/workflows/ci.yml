name: CI
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check files
        run: |
          test -f README.md
          test -f info.txt
          test -f help.txt

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
      - name: Check test secret
        run: |
          if grep -q "TEST_SECRET=DEMO_NOT_REAL" test-secret.txt; then
            echo "Test secret found!"
            exit 1
          fi
