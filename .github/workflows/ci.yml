name: CI
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check files
        run: |
          test -f README.md
          test -f info.txt
          test -f help.txt

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
